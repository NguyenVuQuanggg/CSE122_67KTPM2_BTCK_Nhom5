<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chi tiết yêu cầu</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/collector-request-detail.css">
</head>
<body>
<div id="nav"></div>
<div class="container py-4" style="max-width:600px">
  <h3>Xử lý yêu cầu</h3>
  <select id="task" class="form-select mb-2" onchange="showInfo()"></select>
  <div id="info" class="card p-3 mb-2"></div>
  <select id="status" class="form-select mb-2">
    <option>Đã phân công</option><option>Đang thu gom</option><option>Hoàn thành</option><option>Không thể thu gom</option>
  </select>
  <textarea id="note" class="form-control mb-2" placeholder="Ghi chú..."></textarea>
  <button class="btn btn-success" onclick="save()">Cập nhật</button>
  <span id="msg" class="text-success ms-2"></span>
</div>
<script src="../js/api.js"></script>
<script src="../js/common.js"></script>
<script src="../js/collector-request-detail.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

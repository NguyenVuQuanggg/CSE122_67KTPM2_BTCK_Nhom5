<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phân tích</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/coordinator-analytics.css">
</head>
<body>
<div id="nav"></div>
<div class="container py-4">
  <h3>Số liệu và hiệu suất</h3>
  <div class="row text-center mb-4">
    <div class="col-4"><div class="card p-3">Tổng yêu cầu<div class="num" id="total"></div></div></div>
    <div class="col-4"><div class="card p-3">Hoàn thành<div class="num" id="done"></div></div></div>
    <div class="col-4"><div class="card p-3">Hiệu suất<div class="num" id="rate"></div></div></div>
  </div>
  <div class="card p-3">
    <h5>Khối lượng theo loại rác (kg)</h5>
    <div id="bars"></div>
  </div>
</div>
<script src="../js/api.js"></script>
<script src="../js/common.js"></script>
<script src="../js/coordinator-analytics.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

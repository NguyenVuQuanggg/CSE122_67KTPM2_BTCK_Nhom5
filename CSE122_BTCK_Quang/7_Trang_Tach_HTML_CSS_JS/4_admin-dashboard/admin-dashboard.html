<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard quản trị</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/admin-dashboard.css">
</head>
<body>
<div id="nav"></div>
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">Tổng quan hệ thống</h3>
    <button class="btn btn-sm btn-outline-success" onclick="loadDashboard()">🔄 Làm mới dữ liệu</button>
  </div>

  <!-- Các thẻ thống kê tiến độ thu gom và dữ liệu hệ thống -->
  <div class="row text-center g-3 mb-4" id="stats"></div>

  <!-- Bảng theo dõi tiến độ thu gom tại các điểm -->
  <div class="card p-3 mb-4 shadow-sm">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="mb-0">📍 Tiến độ thu gom rác tại các điểm</h5>
      <span class="badge bg-secondary" id="total-badge">0 yêu cầu</span>
    </div>
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>Mã đơn</th>
            <th>Người gửi</th>
            <th>Địa chỉ / Điểm thu gom</th>
            <th>Loại rác</th>
            <th>Khối lượng</th>
            <th>Nhân viên phụ trách</th>
            <th>Trạng thái</th>
          </tr>
        </thead>
        <tbody id="request-list"></tbody>
      </table>
    </div>
  </div>

  <!-- Hoạt động gần đây theo thời gian thực -->
  <div class="card p-3 shadow-sm">
    <h5 class="mb-3">🔔 Hoạt động gần đây (Nhật ký hệ thống)</h5>
    <ul class="list-group list-group-flush" id="logs"></ul>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/common.js"></script>
<script src="../js/admin-dashboard.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

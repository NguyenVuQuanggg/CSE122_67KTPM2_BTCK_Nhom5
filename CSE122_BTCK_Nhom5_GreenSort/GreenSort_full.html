<script type="text/plain" id="js-index.html">
var u = getUser();
var html = "";
if (u) {
  html = "<a class='btn btn-success btn-lg' href='" + BASE + HOME[u.role] + "'>Vào hệ thống</a>";
} else {
  html = "<a class='btn btn-success btn-lg me-2' href='#login.html'>Đăng nhập</a>";
  html += "<a class='btn btn-outline-success btn-lg' href='#register.html'>Đăng ký</a>";
}
document.getElementById("actions").innerHTML = html;
</script>
<script type="text/plain" id="js-login.html">
function doLogin() {
  var email = document.getElementById("email").value;
  var pass = document.getElementById("pass").value;
  var r = login(email, pass);
  if (r == "notfound") {
    document.getElementById("msg").innerHTML = "Sai email hoặc mật khẩu!";
  } else if (r == "locked") {
    document.getElementById("msg").innerHTML = "Tài khoản đã bị khóa!";
  } else {
    location.hash = HOME[r.role];
  }
}
</script>
<script type="text/plain" id="js-register.html">
function doRegister() {
  var name = document.getElementById("name").value;
  var email = document.getElementById("email").value;
  var pass = document.getElementById("pass").value;
  var pass2 = document.getElementById("pass2").value;
  var msg = document.getElementById("msg");
  if (name == "" || email == "") { msg.innerHTML = "Vui lòng nhập đủ thông tin!"; return; }
  if (pass.length < 6) { msg.innerHTML = "Mật khẩu tối thiểu 6 ký tự!"; return; }
  if (pass != pass2) { msg.innerHTML = "Mật khẩu nhập lại không khớp!"; return; }
  var users = DB.get("users");
  for (var i = 0; i < users.length; i++) {
    if (users[i].email == email || users[i].name == name) { msg.innerHTML = "Email hoặc họ tên đã tồn tại!"; return; }
  }
  users.push({name: name, email: email, password: pass, role: "Người dân", phone: "", address: "", active: true});
  DB.set("users", users);
  alert("Đăng ký thành công!");
  location.hash = "login.html";
}
</script>
<script type="text/plain" id="js-forgot-password.html">
function reset() {
  var email = document.getElementById("email").value;
  var pass = document.getElementById("pass").value;
  if (pass.length < 6) { document.getElementById("msg").innerHTML = "Mật khẩu tối thiểu 6 ký tự!"; return; }
  var users = DB.get("users");
  for (var i = 0; i < users.length; i++) {
    if (users[i].email == email) {
      users[i].password = pass;
      DB.set("users", users);
      alert("Đã đổi mật khẩu!");
      location.hash = "login.html";
      return;
    }
  }
  document.getElementById("msg").innerHTML = "Không tìm thấy email này!";
}
</script>
<script type="text/plain" id="js-profile.html">
requireLogin();
var user = getUser();
document.getElementById("name").value = user.name;
document.getElementById("email").value = user.email;
document.getElementById("role").value = user.role;
document.getElementById("phone").value = user.phone;
document.getElementById("address").value = user.address;
function save() {
  var users = DB.get("users");
  for (var i = 0; i < users.length; i++) {
    if (users[i].email == user.email) {
      users[i].phone = document.getElementById("phone").value;
      users[i].address = document.getElementById("address").value;
    }
  }
  DB.set("users", users);
  document.getElementById("msg").innerHTML = "Đã lưu!";
}
</script>
<script type="text/plain" id="js-settings.html">
requireLogin();
var user = getUser();
var key = "set_" + user.email;
var s = DB.get(key) || {dark: false, notif: true};
document.getElementById("dark").checked = s.dark;
document.getElementById("notif").checked = s.notif;
function saveSettings() {
  s.dark = document.getElementById("dark").checked;
  s.notif = document.getElementById("notif").checked;
  DB.set(key, s);
  applyTheme();
  renderNav();
}
function changePass() {
  var users = DB.get("users");
  var oldP = document.getElementById("old").value;
  var newP = document.getElementById("new").value;
  if (newP.length < 6) { alert("Mật khẩu mới tối thiểu 6 ký tự!"); return; }
  for (var i = 0; i < users.length; i++) {
    if (users[i].email == user.email) {
      if (users[i].password != oldP) { alert("Mật khẩu cũ không đúng!"); return; }
      users[i].password = newP;
    }
  }
  DB.set("users", users);
  alert("Đã đổi mật khẩu!");
}
</script>
<script type="text/plain" id="js-notifications.html">
requireLogin();
var user = getUser();
var list = DB.get("notifications");
function show() {
  var html = "";
  for (var i = list.length - 1; i >= 0; i--) {
    var n = list[i];
    if (n.to != user.name && n.to != user.role) continue;
    html += "<li class='list-group-item'>" + (n.read ? "" : "<span class='badge bg-danger me-2'>Mới</span>") + n.text;
    html += "<br><small class='text-muted'>" + n.time + "</small></li>";
    n.read = true;
  }
  if (html == "") html = "<li class='list-group-item'>Chưa có thông báo.</li>";
  document.getElementById("list").innerHTML = html;
  DB.set("notifications", list);
  renderNav();
}
function clearMine() {
  var rest = [];
  for (var i = 0; i < list.length; i++) {
    if (list[i].to != user.name && list[i].to != user.role) rest.push(list[i]);
  }
  list = rest;
  show();
}
show();
</script>
<script type="text/plain" id="js-pages/resident-collection-points.html">
requireRole(["Người dân"]);
var points = DB.get("points");
var types = DB.get("types");
var opts = "<option>Tất cả</option>";
for (var k = 0; k < types.length; k++) {
  opts += "<option>" + types[k].name + "</option>";
}
document.getElementById("filter").innerHTML = opts;
function show() {
  var f = document.getElementById("filter").value;
  var html = "";

<script type="text/plain" id="js-pages/admin-dashboard.html">
requireRole(["Quản trị viên"]);
function loadDashboard() {
  var users = api.get("users");
  var requests = api.get("requests");
  var points = api.get("points");
  var types = api.get("types");
  var notifications = api.get("notifications");

  var pendingCount = 0;
  var inProgressCount = 0;
  var doneCount = 0;
  var doneKg = 0;

  for (var i = 0; i < requests.length; i++) {
    var req = requests[i];
    if (req.status === "Chờ phân công") pendingCount++;
    else if (req.status === "Đã phân công" || req.status === "Đang thu gom") inProgressCount++;
    else if (req.status === "Hoàn thành") { doneCount++; doneKg += Number(req.kg) || 0; }
  }

  var stats = [
    { label: "Tổng yêu cầu", value: requests.length, color: "text-dark" },
    { label: "Chờ điều phối", value: pendingCount, color: "text-warning" },
    { label: "Đang thu gom", value: inProgressCount, color: "text-primary" },
    { label: "Đã thu gom xong", value: doneCount, color: "text-success" },
    { label: "Rác đã thu gom", value: doneKg + " kg", color: "text-success" },
    { label: "Điểm thu gom", value: points.length, color: "text-info" },
    { label: "Người dùng", value: users.length, color: "text-secondary" },
    { label: "Loại rác", value: types.length, color: "text-secondary" }
  ];

  var htmlStats = "";
  for (var s = 0; s < stats.length; s++) {
    htmlStats += "<div class='col-6 col-md-3 mb-2'>";
    htmlStats += "<div class='card p-3 h-100 shadow-sm border-0'>";
    htmlStats += "<div class='text-muted small mb-1'>" + stats[s].label + "</div>";
    htmlStats += "<div class='num " + stats[s].color + "'>" + stats[s].value + "</div>";
    htmlStats += "</div></div>";
  }
  document.getElementById("stats").innerHTML = htmlStats;

  document.getElementById("total-badge").innerText = requests.length + " yêu cầu";
  var htmlRequests = "";
  if (requests.length === 0) {
    htmlRequests = "<tr><td colspan='7' class='text-center text-muted py-3'>Chưa có yêu cầu nào.</td></tr>";
  } else {
    for (var r = requests.length - 1; r >= 0; r--) {
      var item = requests[r];
      var badgeClass = "bg-secondary";
      if (item.status === "Chờ phân công") badgeClass = "bg-warning text-dark";
      else if (item.status === "Đã phân công") badgeClass = "bg-primary";
      else if (item.status === "Đang thu gom") badgeClass = "bg-info text-dark";
      else if (item.status === "Hoàn thành") badgeClass = "bg-success";

      var staffText = item.staff ? item.staff : "<span class='text-muted italic'>Chưa giao</span>";
      htmlRequests += "<tr><td>#" + item.id + "</td><td>" + item.resident + "</td><td>📍 " + item.address + "</td><td>" + item.type + "</td><td>" + item.kg + " kg</td><td>" + staffText + "</td><td><span class='badge " + badgeClass + "'>" + item.status + "</span></td></tr>";
    }
  }
  document.getElementById("request-list").innerHTML = htmlRequests;

  var recentLogs = [];
  if (notifications && notifications.length > 0) {
    for (var n = notifications.length - 1; n >= 0 && recentLogs.length < 6; n--) {
      recentLogs.push({ text: notifications[n].text, time: notifications[n].time });
    }
  }
  if (recentLogs.length < 3) {
    for (var q = requests.length - 1; q >= 0 && recentLogs.length < 5; q--) {
      var reqLog = requests[q];
      recentLogs.push({
        text: reqLog.resident + " đã gửi yêu cầu thu gom " + reqLog.type + " (" + reqLog.kg + "kg) tại " + reqLog.address,
        time: reqLog.date || "Gần đây"
      });
    }
  }

  var htmlLogs = "";
  for (var j = 0; j < recentLogs.length; j++) {
    htmlLogs += "<li class='list-group-item d-flex justify-content-between align-items-center py-2'><span>📌 " + recentLogs[j].text + "</span><small class='text-muted'>" + recentLogs[j].time + "</small></li>";
  }
  document.getElementById("logs").innerHTML = htmlLogs;
}
loadDashboard();
</script>

  "Điều phối viên": [["Bảng yêu cầu", "pages/coordinator-request-board.html"], ["Quản lý điểm", "pages/coordinator-point-management.html"], ["Phân tích", "pages/coordinator-analytics.html"]],
  "Quản trị viên": [["Dashboard", "pages/admin-dashboard.html"], ["Điểm thu gom", "pages/coordinator-point-management.html"], ["Loại rác", "pages/admin-waste-type-management.html"], ["Người dùng", "pages/admin-user-management.html"]]
};
function getUser() {
  var email = localStorage.getItem("gs_current");
  var users = DB.get("users");
  for (var i = 0; i < users.length; i++) {
    if (users[i].email == email) return users[i];
  }
  return null;
}
function login(email, password) {
  var users = DB.get("users");
  for (var i = 0; i < users.length; i++) {
    if (users[i].email == email && users[i].password == password) {
      if (!users[i].active) return "locked";
      localStorage.setItem("gs_current", email);
      return users[i];
    }
  }
  return "notfound";
}
function logout() {
  localStorage.removeItem("gs_current");
  location.href = BASE + "login.html";
}
function requireLogin() {
  if (getUser() == null) location.href = BASE + "login.html";
}
function requireRole(roles) {
  var u = getUser();
  if (u == null) { location.href = BASE + "login.html"; }
  else if (roles.indexOf(u.role) == -1) { location.href = BASE + "403.html"; }
}
function getNames(role) {
  var users = DB.get("users");
  var names = [];
  for (var i = 0; i < users.length; i++) {
    if (users[i].role == role && users[i].active) names.push(users[i].name);
  }
  return names;
}
function notify(to, text) {
  var list = DB.get("notifications");
  list.push({to: to, text: text, time: new Date().toLocaleString("vi-VN"), read: false});
  DB.set("notifications", list);
}
function applyTheme() {
  var u = getUser();
  var s = u ? DB.get("set_" + u.email) : null;
  document.documentElement.setAttribute("data-bs-theme", (s && s.dark) ? "dark" : "light");
}
function renderNav() {
  var u = getUser();
  var html = "<nav class='navbar navbar-expand navbar-dark bg-success px-3'>";
  html += "<a class='navbar-brand' href='" + BASE + "index.html'>♻ GreenSort</a><div class='navbar-nav me-auto'>";
  if (u) {
    var m = MENU[u.role];
    for (var i = 0; i < m.length; i++) {
      html += "<a class='nav-link' href='" + BASE + m[i][1] + "'>" + m[i][0] + "</a>";
    }
  }
  html += "</div><div class='navbar-nav align-items-center'>";
  if (u) {
    var list = DB.get("notifications");
    var count = 0;
    for (var j = 0; j < list.length; j++) {
      if (!list[j].read && (list[j].to == u.name || list[j].to == u.role)) count++;
    }
    var st = DB.get("set_" + u.email);
    var badge = (st && st.notif === false) ? "" : " <span class='badge bg-danger'>" + count + "</span>";
    html += "<a class='nav-link' href='" + BASE + "notifications.html'>🔔" + badge + "</a>";
    html += "<a class='nav-link' href='" + BASE + "profile.html'>" + u.name + "</a>";
    html += "<a class='nav-link' href='" + BASE + "settings.html'>Cài đặt</a>";
    html += "<button class='btn btn-sm btn-light ms-2' onclick='logout()'>Đăng xuất</button>";
  } else {
    html += "<a class='nav-link' href='" + BASE + "login.html'>Đăng nhập</a><a class='nav-link' href='" + BASE + "register.html'>Đăng ký</a>";
  }
  html += "</div></nav>";
  document.getElementById("nav").innerHTML = html;
}
applyTheme();
if (document.getElementById("nav")) renderNav();
function showPage() {
  var route = location.hash.slice(1).split("?")[0];
  if (route == "") route = "index.html";
  var tpl = document.getElementById("tpl-" + route);
  if (tpl == null) { route = "404.html"; tpl = document.getElementById("tpl-404.html"); }
  var app = document.getElementById("app");
  app.innerHTML = "";
  app.appendChild(tpl.content.cloneNode(true));
  var old = document.getElementById("page-js");
  if (old) old.remove();
  var s = document.createElement("script");
  s.id = "page-js";
  s.text = document.getElementById("js-" + route).text;
  document.body.appendChild(s);
  renderNav();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", showPage);
showPage();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

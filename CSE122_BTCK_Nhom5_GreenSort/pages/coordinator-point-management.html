<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý điểm thu gom</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/coordinator-point-management.css">
</head>
<body>
<div id="nav"></div>
<div class="container py-4">
  <h3>Quản lý điểm thu gom</h3>
  <div class="row g-2 mb-3">
    <div class="col-md-3"><input id="name" class="form-control" placeholder="Tên điểm"></div>
    <div class="col-md-3"><input id="addr" class="form-control" placeholder="Địa chỉ"></div>
    <div class="col-md-3"><input id="types" class="form-control" placeholder="Loại rác nhận (vd: Tái chế, Hữu cơ)"></div>
    <div class="col-md-3"><button class="btn btn-warning w-100" onclick="addPoint()">Thêm điểm</button></div>
  </div>
  <table class="table table-bordered bg-white">
    <thead><tr><th>Tên điểm</th><th>Địa chỉ</th><th>Loại rác nhận</th><th>Thao tác</th></tr></thead>
    <tbody id="list"></tbody>
  </table>
</div>
<script src="../js/api.js"></script>
<script src="../js/common.js"></script>
<script src="../js/coordinator-point-management.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

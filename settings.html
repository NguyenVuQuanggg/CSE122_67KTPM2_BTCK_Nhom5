<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cài đặt</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/settings.css">
</head>
<body>
<div id="nav"></div>
<div class="container py-4" style="max-width:520px">
  <h3>Cài đặt tài khoản</h3>
  <div class="form-check form-switch mb-2"><input id="dark" type="checkbox" class="form-check-input"><label>Chế độ tối</label></div>
  <div class="form-check form-switch mb-3"><input id="notif" type="checkbox" class="form-check-input"><label>Nhận thông báo</label></div>
  <button class="btn btn-success mb-4" onclick="saveSettings()">Lưu cài đặt</button>
  <h5>Đổi mật khẩu</h5>
  <input id="old" type="password" class="form-control mb-2" placeholder="Mật khẩu cũ">
  <input id="new" type="password" class="form-control mb-2" placeholder="Mật khẩu mới (từ 6 ký tự)">
  <button class="btn btn-outline-success" onclick="changePass()">Đổi mật khẩu</button>
</div>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/settings.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

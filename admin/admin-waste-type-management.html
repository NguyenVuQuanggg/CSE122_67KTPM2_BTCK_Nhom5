<!DOCTYPE html> <!-- khai báo HTML5 -->
<html lang="vi"> <!-- tiếng Việt -->
<head>
<meta charset="UTF-8"> <!-- mã hóa ký tự -->
<meta name="viewport" content="width=device-width, initial-scale=1"> <!-- responsive -->
<title>Quản lý loại rác</title> <!-- tiêu đề tab -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> <!-- Bootstrap CSS -->
<style> /* CSS riêng */
body { background: #f3f3f7; } /* màu nền */
</style>
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark px-3"> <!-- thanh menu -->
  <span class="navbar-brand">Quản trị viên</span> <!-- tên role -->
  <a class="nav-link text-white" href="admin-dashboard.html">Dashboard</a> <!-- link trang 1 -->
  <a class="nav-link text-white" href="admin-waste-type-management.html">Loại rác</a> <!-- link trang 2 -->
  <a class="nav-link text-white" href="admin-user-management.html">Người dùng</a> <!-- link trang 3 -->
</nav>
<div class="container py-4"> <!-- khung nội dung -->
  <h3>Quản lý loại rác</h3> <!-- tiêu đề -->
  <div class="row g-2 mb-3"> <!-- hàng form -->
    <div class="col-md-4"><input id="name" class="form-control" placeholder="Tên loại rác"></div> <!-- ô tên -->
    <div class="col-md-5"><input id="desc" class="form-control" placeholder="Mô tả"></div> <!-- ô mô tả -->
    <div class="col-md-3"><button class="btn btn-dark w-100" onclick="addType()">Thêm loại</button></div> <!-- nút thêm -->
  </div>
  <table class="table table-bordered bg-white"> <!-- bảng -->
    <thead><tr><th>Tên</th><th>Mô tả</th><th>Thao tác</th></tr></thead> <!-- tiêu đề cột -->
    <tbody id="list"></tbody> <!-- nơi đổ dữ liệu -->
  </table>
</div>
<script> // JavaScript
var types = [ // mảng các loại rác
  {name: "Hữu cơ", desc: "Thức ăn thừa, vỏ rau củ"}, // loại 1
  {name: "Tái chế", desc: "Giấy, nhựa, kim loại"}, // loại 2
  {name: "Nguy hại", desc: "Pin, hóa chất"} // loại 3
];
function show() { // hàm hiển thị bảng
  var html = ""; // chuỗi HTML
  for (var i = 0; i < types.length; i++) { // duyệt các loại
    html += "<tr><td>" + types[i].name + "</td><td>" + types[i].desc + "</td>"; // 2 cột dữ liệu
    html += "<td><button class='btn btn-sm btn-danger' onclick='removeType(" + i + ")'>Xóa</button></td></tr>"; // nút xóa
  }
  document.getElementById("list").innerHTML = html; // đưa vào bảng
}
function addType() { // hàm thêm loại rác
  var name = document.getElementById("name").value; // lấy tên
  var desc = document.getElementById("desc").value; // lấy mô tả
  if (name == "") { // tên không được trống
    alert("Vui lòng nhập tên loại rác!"); // báo lỗi
    return; // dừng hàm
  }
  types.push({name: name, desc: desc}); // thêm vào mảng
  document.getElementById("name").value = ""; // xóa ô tên
  document.getElementById("desc").value = ""; // xóa ô mô tả
  show(); // vẽ lại bảng
}
function removeType(i) { // hàm xóa loại thứ i
  if (confirm("Xóa loại rác này?")) { // hỏi xác nhận
    types.splice(i, 1); // xóa khỏi mảng
    show(); // vẽ lại bảng
  }
}
show(); // chạy khi mở trang
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> <!-- Bootstrap JS -->
</body>
</html>

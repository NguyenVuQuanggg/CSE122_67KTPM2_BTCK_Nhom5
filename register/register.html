<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng ký</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/register.css">
</head>
<body>
<div id="nav"></div>
<div class="container py-5" style="max-width:420px">
  <h3 class="mb-3">Đăng ký tài khoản</h3>
  <input id="name" class="form-control mb-2" placeholder="Họ tên">
  <input id="email" class="form-control mb-2" placeholder="Email">
  <input id="pass" type="password" class="form-control mb-2" placeholder="Mật khẩu (từ 6 ký tự)">
  <input id="pass2" type="password" class="form-control mb-2" placeholder="Nhập lại mật khẩu">
  <button class="btn btn-success w-100 mb-2" onclick="doRegister()">Đăng ký</button>
  <div id="msg" class="text-danger mb-2"></div>
  <a href="login.html">Đã có tài khoản? Đăng nhập</a>
</div>
<script src="js/common.js"></script>
<script src="js/register.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

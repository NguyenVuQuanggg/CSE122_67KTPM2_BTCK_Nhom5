<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quên mật khẩu</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/forgot-password.css">
</head>
<body>
<div id="nav"></div>
<div class="container py-5" style="max-width:420px">
  <h3 class="mb-3">Khôi phục mật khẩu</h3>
  <input id="email" class="form-control mb-2" placeholder="Email đã đăng ký">
  <input id="pass" type="password" class="form-control mb-2" placeholder="Mật khẩu mới (từ 6 ký tự)">
  <button class="btn btn-success w-100 mb-2" onclick="reset()">Đặt lại mật khẩu</button>
  <div id="msg" class="text-danger mb-2"></div>
  <a href="login.html">Quay lại đăng nhập</a>
</div>
<script src="js/common.js"></script>
<script src="js/forgot-password.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
